[package]
name = "metarace-rre-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Metarace manager for the RaceRoom dedicated server"
license = "UNLICENSED"
publish = false

[[bin]]
name = "metarace-rre-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = "0.4"
hex = "0.4"
http = "1"
nix = { version = "0.29", features = ["signal", "process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"

[build-dependencies]
clrmeta = "0.1.0"
goblin = { version = "0.10", default-features = false, features = ["pe32", "pe64", "alloc", "endian_fd", "std"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
